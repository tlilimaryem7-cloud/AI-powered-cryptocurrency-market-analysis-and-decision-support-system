<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 65" width="260" height="65">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f7931a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#627eea;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chartgrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f7931a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#627eea;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Chart icon -->
  <g transform="translate(8, 10)">
    <!-- Chart bars -->
    <rect x="0"  y="28" width="6" height="12" rx="1.5" fill="#f7931a" opacity="0.7"/>
    <rect x="9"  y="20" width="6" height="20" rx="1.5" fill="#f7931a" opacity="0.85"/>
    <rect x="18" y="12" width="6" height="28" rx="1.5" fill="url(#chartgrad)"/>
    <rect x="27" y="6"  width="6" height="34" rx="1.5" fill="#627eea" opacity="0.85"/>

    <!-- Trend line -->
    <polyline
      points="3,34 12,24 21,16 30,8"
      fill="none"
      stroke="url(#grad)"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Arrow up -->
    <polygon points="30,4 34,10 26,10" fill="#627eea"/>
  </g>

  <!-- CoinTrend text -->
  <text
    x="56" y="30"
    font-family="Arial, sans-serif"
    font-size="22"
    font-weight="800"
    fill="url(#grad)"
    letter-spacing="-0.5"
  >CoinTrend</text>

  <!-- Divider line -->
  <line x1="57" y1="38" x2="255" y2="38"
        stroke="#30363d" stroke-width="0.5"/>

  <!-- Full slogan -->
  <text
    x="57" y="52"
    font-family="Arial, sans-serif"
    font-size="9"
    font-weight="400"
    fill="#8b949e"
    letter-spacing="1.8"
  >ONE STEP AHEAD OF THE MARKET</text>
</svg>
